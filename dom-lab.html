<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>лаборатория dom</title>
  <script src="js/dom.js" defer></script>
</head>

<style>
    .success {
      color: green;
      background-color: #e6ffe6;
      padding: 10px;
    }

    .warning {
      color: darkred;
      background-color: #ffe6e6;
      padding: 10px;
    }
  </style>


<body>
  <h1 id="main-title">изучаем javascript dom</h1>
  <p id="message">это исходный текст.</p>

  <h2 id="main-student">информация о студенте</h2>
  <p id="student-name">имя не указано</p>
  <p id="student-group">группа не указана</p>
  <p id="student-age"></p>
  <p id="student-lang"></p>

  <h2>своя карточка товара</h2>
  <div id="product-card">
    <h3 id="product-name">ноутбук</h3>
    <p id="product-price">цена: 50000 рублей</p>
  </div>

  <h2>список предметов</h2>
  <ul id="subjects">
    <li>веб-разработка</li>
    <li>информатика</li>
    <li><strong>физика</strong></li>
    <li>ЭВМ</li>
  </ul>

  <p id="status">статус: ожидает проверки</p>
</body>

</html>
